import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.5.6'
}

group = 'pos.api'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

checkstyle {
    toolVersion = '10.12.4'
    configDirectory = file('config/checkstyle')
}

configurations.checkstyle {
    resolutionStrategy.capabilitiesResolution.withCapability("com.google.collections:google-collections") {
        select("com.google.guava:guava:0")
    }
}

spotbugs {
    toolVersion = '4.8.6'
    effort.set(Effort.valueOf('MAX'))
    reportLevel.set(Confidence.valueOf('LOW'))
}

tasks.withType(SpotBugsTask).configureEach {
    enabled = false // Desactivamos SpotBugs
    reports {
        xml.required.set(false)
        html.required.set(true)
    }
    ignoreFailures = true
}

tasks.withType(Checkstyle) {
    ignoreFailures = true
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

repositories {
    mavenCentral()
}

dependencies {
    // 1. BOM de Testcontainers (Este sí se descarga sin problemas)
    testImplementation platform("org.testcontainers:testcontainers-bom:1.20.4")

    // 2. Entidades y Persistencia (Versiones auto-gestionadas por Spring Boot 3.4.2)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // 3. Seguridad
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 4. Validación
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 5. Web Starter
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 6. Seguridad JWT (Forzamos la versión exacta directamente en el artefacto)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Driver de Base de Datos
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Bloque de pruebas
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Lombok para pruebas
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Testcontainers
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
}