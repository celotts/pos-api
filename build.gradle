plugins {
	id 'java'

	id 'org.springframework.boot' version '3.2.12'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'com.github.spotbugs' version '5.1.3'
}

group = 'pos.api'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

checkstyle {
    toolVersion = '10.12.4'
    configDirectory = file('config/checkstyle')
}

spotbugs {
    toolVersion = '4.7.3'
    effort = 'max'
    reportLevel = 'low'
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
    reports {
        xml.required.set(false)
        html.required.set(true)
    }
    // Do not fail the build on SpotBugs findings by default in CI
    ignoreFailures = true
}

tasks.withType(Checkstyle) {
    // Do not fail build on style violations by default
    ignoreFailures = true
}

repositories {
	mavenCentral()
}

dependencies {
    // 1. Entidades y Persistencia (Sin versión fija)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 2. Seguridad (Sin versión fija)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 3. Validación (Sin versión fija)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 4. 🔥 CORRECCIÓN: Cambiado de 'spring-boot-starter-webmvc:3.2.5' al starter correcto de Spring
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Validación Jakarta estándar
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'

    // Seguridad JWT (Estos sí requieren su versión específica)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // Driver de Base de Datos
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok dependencia (Para usar anotaciones como @Getter, @Setter, etc.)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Bloque de pruebas corregido
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Lombok dependencia para pruebas
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.testcontainers:postgresql:1.19.7'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
}

tasks.named('test') {
	useJUnitPlatform()
}
