import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.5.6'
    id "com.diffplug.spotless" version "6.25.0"
}

group = 'pos.api'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

checkstyle {
    toolVersion = '10.12.4'
    configDirectory = file('config/checkstyle')
}

configurations.configureEach {
    resolutionStrategy.capabilitiesResolution.withCapability("com.google.collections:google-collections") {
        select("com.google.guava:guava:0")
    }
}

spotbugs {
    toolVersion = '4.8.6'
    effort.set(Effort.valueOf("MAX"))
    reportLevel.set(Confidence.valueOf("LOW"))
    excludeFilter = file("${rootDir}/config/spotbugs/exclude.xml")
}

tasks.withType(SpotBugsTask).configureEach {
    enabled = true
    reports {
        xml.required.set(false)
        html.required.set(true)
    }
    ignoreFailures = false
}

tasks.withType(Checkstyle).configureEach {
    ignoreFailures = true
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs('-XX:+EnableDynamicAgentLoading')
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spring.io/release' }
    maven { url = 'https://repo.spring.io/milestone' }
    maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
    // Restricciones de versiones para corregir vulnerabilidades transitivas
    constraints {
        add('implementation', 'org.apache.commons:commons-compress:1.26.0') {
            because 'Soluciona CVE-2024-25710 y CVE-2024-26308 en dependencias transitivas'
        }
        add('implementation', 'org.webjars:swagger-ui:5.18.2') {
            because 'Soluciona vulnerabilidades en los recursos estáticos de Swagger UI'
        }
    }

    // Platform / BOMs
    testImplementation platform("org.testcontainers:testcontainers-bom:1.19.8")
    implementation platform("org.springframework.ai:spring-ai-bom:1.1.0")

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Dependencia de Spring AI para Ollama
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

    // DB & JPA Utilities
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.8.2'
    runtimeOnly 'org.postgresql:postgresql'

    // JJWT (Seguridad / JWT)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Lombok & MapStruct
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-subclass:5.14.2'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}
