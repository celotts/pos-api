services:
  db:
    image: postgres:15-alpine
    container_name: pos_db
    environment:
      POSTGRES_DB: pos_db
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product123
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    networks:
      - pos-network
    # 🟢 Corregido para que el parser de podman-compose no truene en Python
    healthcheck:
      test: "pg_isready -U product -d pos_db"
      interval: 10s
      timeout: 10s
      retries: 5

  app:
    build: .
    container_name: pos_api_app
    ports:
      - "9090:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # 🛠️ Apuntamos a 'pos_db' que es el container_name real de tu servicio db
      SPRING_DATASOURCE_URL: jdbc:postgresql://pos_db:5432/pos_db
      SPRING_DATASOURCE_USERNAME: product
      SPRING_DATASOURCE_PASSWORD: product123
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      JWT_SECRET: "======================CelottsJWTSecretDefaultDevKey==========================="
      JWT_EXPIRATION: "3600000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pos-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  pos-network:
    driver: bridge

volumes:
  db_data: