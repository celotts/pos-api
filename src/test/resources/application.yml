# Server Port
server:
  port: 0

# Datasource Configuration (for local IDE execution)
# These will be overridden by environment variables when running with Podman
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pos_db
    username: pos_user
    password: pos_password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none # 'none' because we are managing the schema with SQL scripts (V1, V2)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# JWT Security Configuration (Required for Integration Tests)
jwt:
  secret: ${JWT_SECRET:clavesecretadebackendedeseguridadsuperlargade64bytes12345}

# Logging
logging:
  level:
    org:
      springframework:
        web: DEBUG
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE