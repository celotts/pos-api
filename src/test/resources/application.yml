# ===================================================================
# TEST CONFIGURATION
# ===================================================================
server:
  port: 0

spring:
  application:
    name: pos-api-test

  # --- Datasource Configuration (H2 for tests) ---
  datasource:
    datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

  # --- H2 Console (optional for debugging) ---
  h2:
    console:
      enabled: false

  # --- JPA/Hibernate Configuration ---
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  # --- RabbitMQ Configuration ---
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# ===================================================================
# APP CONFIGURATION
# ===================================================================
app:
  jwt:
    secret: dGVzdHNlY3JldGZvcnRlc3RpbmdwdXJwb3Nlc29ubHk=
    expiration-in-ms: 3600000
  bootstrap:
    admin:
      email: test@posapi.com
      password: TestPassword123!

# ===================================================================
# LOGGING
# ===================================================================
logging:
  level:
    root: WARN
    com.posapi: DEBUG
    org.springframework.test: DEBUG
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
