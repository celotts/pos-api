spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true # Enable SQL logging
    properties:
      hibernate:
        format_sql: true # Format SQL for readability
        dialect: org.hibernate.dialect.PostgreSQLDialect # Explicitly set dialect
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl # Use standard naming
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl # Use legacy JPA implicit naming
        temp.use_jdbc_metadata_defaults: false # Prevent Hibernate from using JDBC metadata for schema inference
  app:
    jwt:
      secret: dGVzdHNlY3JldGZvcnRlc3RpbmdwdXJwb3Nlc29ubHk=
      expiration-in-ms: 3600000 # Aquí está definido en 1 hora

  flyway:
    enabled: true
    locations: classpath:db/migration
# ===================================================================
# APP CONFIGURATION
# ===================================================================
app:
  jwt:
    secret: ${dGVzdHNlY3JldGZvcnRlc3RpbmdwdXJwb3Nlc29ubHk=}
    expiration-in-ms: 600000
  bootstrap:
    admin:
      email: test@posapi.com
      password: TestPassword123!

logging:
  level:
    org.hibernate.orm.deprecation: ERROR
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
