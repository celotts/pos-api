server:
  port: ${SERVER_PORT:8080}

# ===================================================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ===================================================================
spring:
  application:
    name: pos-api
  # --- Datasource Configuration ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB:pos_db}
    username: ${SPRING_DATASOURCE_USERNAME:product}
    password: ${SPRING_DATASOURCE_PASSWORD:product123}
    driver-class-name: org.postgresql.Driver
  # --- JPA/Hibernate Configuration ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # --- RabbitMQ Configuration ---
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

# ===================================================================
# CONFIGURACIÓN DE APP (Configuración requerida por componentes internos)
# ===================================================================
app:
  jwt:
    secret: ${JWT_SECRET:dGhpc2lzYW5leGFtcGxlYmFzZTY0c2VjcmV0Zm9ySFRNQzI1Ng==}
    expiration-in-ms: ${JWT_EXPIRATION:3600000} # 1 hora
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:admin@posapi.com}
      password: ${ADMIN_PASSWORD:SuperSecretPassword123!}

# ===================================================================
# LOGGING
# ===================================================================
logging:
  level:
    com.posapi: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
