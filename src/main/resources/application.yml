# Server Port
server:
  port: 8080

# Datasource Configuration (for local IDE execution)
# These will be overridden by environment variables when running with Podman
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pos_db
    username: pos_user
    password: pos_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none # 'none' because we are managing the schema with SQL scripts (V1, V2)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Logging
logging:
  level:
    org:
      springframework:
        web: DEBUG
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE
