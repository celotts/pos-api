# ===================================================================
# CONFIGURACIÓN DE SPRING BOOT PARA EL PERFIL 'DOCKER'
# ===================================================================
# Estas propiedades sobrescriben las de 'application.yml' cuando
# la aplicación se ejecuta dentro de un contenedor Docker.

spring:
  datasource:
    # Dentro de la red de Docker, nos conectamos al servicio 'pos_db' en lugar de 'localhost'.
    url: jdbc:postgresql://pos_db:5432/${POSTGRES_DB:pos_db}
    username: ${POSTGRES_USER:product}
    password: ${POSTGRES_PASSWORD:product123}
  jpa:
    hibernate:
      # Para entornos de desarrollo/pruebas en Docker, permitimos que Hibernate actualice el esquema.
      # Si se utiliza una herramienta de migración de base de datos como Flyway, esta debería encargarse de la creación del esquema.
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false # Deshabilitar Flyway temporalmente para permitir que Hibernate gestione el esquema.
    # Si Flyway es necesario, asegúrate de que tus scripts de migración creen todas las tablas.
  rabbitmq:
    # Dentro de la red de Docker, nos conectamos al servicio 'rabbitmq' (si lo tuvieras).
    host: rabbitmq
  ai: # Configuración de Spring AI para Docker
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://host.docker.internal:11434} # Apunta al host desde el contenedor
      chat:
        options:
          model: llama3.2 # Asegúrate de que este modelo esté descargado en tu Ollama local
  mvc: # Configuración para resolver el problema de patrones de URL de Swagger UI
    pathmatch:
      matching-strategy: ant_path_matcher

springdoc: # <--- AÑADIDO: Deshabilitar Springdoc
  swagger-ui:
    enabled: false # <--- ¡NUEVA LÍNEA!
  api-docs:
    enabled: false # <--- ¡NUEVA LÍNEA!

logging:
  level:
    com.posapi: DEBUG
    org.hibernate.tool.hbm2ddl: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.access: DEBUG
    org.springframework.web: INFO
