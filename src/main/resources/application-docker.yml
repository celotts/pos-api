server:
  port: 8080 # Puerto interno del contenedor

spring:
  cloud:
    gateway:
      enabled: false
  application:
    name: product-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          # 🛡️ Homologado con la variable JWT_SECRET
          secret-key: ${JWT_SECRET}
  jwt:
    # 🛡️ Homologado con la variable JWT_SECRET
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}
  eureka:
    client:
      service-url:
        defaultZone: ${DISCOVERY_SERVICE_EUREKA:http://discovery-service:8761/eureka/}
    instance:
      prefer-ip-address: true
      instance-id: ${spring.application.name}:${random.value}
  management:
    endpoints:
      web:
        exposure:
          include: "*"
    tracing:
      sampling:
        probability: 1.0
      zipkin:
        tracing:
          endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}
  logging:
    level:
      com.posapi: DEBUG
      org.springframework.web: INFO