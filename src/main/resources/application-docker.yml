
services:
  db:
    image: postgres:15-alpine
    container_name: pos_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product}
      POSTGRES_USER: ${POSTGRES_USER:-product}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-product123}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    restart: unless-stopped
    networks:
      - pos-network
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pos_api_app
    restart: unless-stopped
    networks:
      - pos-network
    ports:
      - "${PRODUCT_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-product}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-product}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-product123}
      
      # Inyectamos las variables limpias; tu application.yml se encargará de mapearlas a la ruta correcta
      JWT_SECRET: ${JWT_SECRET:-dGhpc2lzYW5leGFtcGxlYmFzZTY0c2VjcmV0Zm9ySFRNQzI1Ng==}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

      # Credenciales para el usuario administrador inicial (sobrescribe los defaults de application.yml)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@posapi.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-SuperSecretPassword123!}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  pos-network:
    driver: bridge

volumes:
  db_data: